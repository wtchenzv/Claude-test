<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" ><style>@keyframes pop{0%{opacity:0;transform:translateY(22px) scale(.92)}100%{opacity:1;transform:none}}@keyframes boing{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes drift{0%{transform:translateX(-40px)}100%{transform:translateX(60px)}}@keyframes drift2{0%{transform:translateX(50px)}100%{transform:translateX(-50px)}}@keyframes fly{0%{transform:translate(-80px,10px)}100%{transform:translate(460px,-14px)}}@keyframes train{0%{transform:translateX(-140px)}100%{transform:translateX(420px)}}@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes snow{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(240px);opacity:0}}@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.fb{transform-box:fill-box;transform-origin:center}.cloud1{animation:drift 9s ease-in-out infinite alternate}.cloud2{animation:drift2 11s ease-in-out infinite alternate}.plane{animation:fly 16s linear infinite}.trainx{animation:train 11s linear infinite}.tw{animation:twinkle 1.6s ease-in-out infinite}.tw2{animation:twinkle 2.2s ease-in-out .5s infinite}.tw3{animation:twinkle 1.9s ease-in-out 1s infinite}.sunx{animation:sun 4s ease-in-out infinite}.sway{animation:sway 4s ease-in-out infinite;transform-origin:bottom center;transform-box:fill-box}.snowd{animation:snow 7s linear infinite}.bobx{animation:bob 2.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="sway"><path d="M40 16 L54 38 H26Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/><path d="M40 28 L58 54 H22Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/><rect x="36" y="54" width="8" height="10" fill="#F2A497" stroke="#3E3A39" stroke-width="3"/><path class="tw fb" d="M40 4 L43 12 L51 12 L45 17 L47 25 L40 20 L33 25 L35 17 L29 12 L37 12Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/></g><circle class="tw2 fb" cx="34" cy="44" r="3" fill="#F2A497"/><circle class="tw fb" cx="47" cy="50" r="3" fill="#F6D27A"/></svg>
