          <rect x="10" y="213" width="14" height="8" rx="3" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
          <rect x="32" y="213" width="14" height="8" rx="3" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
          <rect x="54" y="213" width="14" height="8" rx="3" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5"/>
          <path d="M88 213 L102 213 Q108 215 112 221 L88 221Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="22" cy="237" r="5" fill="#3E3A39"/><circle cx="96" cy="237" r="5" fill="#3E3A39"/>
        </g>
      </g>
      <!-- snow dots -->
      <g fill="#fff" stroke="#A8D3E6" stroke-width="2">
