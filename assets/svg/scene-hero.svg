        <circle class="snowd" style="animation-delay:-2s" cx="130" cy="0" r="2.5"/>
        <circle class="snowd" style="animation-delay:-4s" cx="215" cy="0" r="3"/>
        <circle class="snowd" style="animation-delay:-1s" cx="300" cy="0" r="2.5"/>
        <circle class="snowd" style="animation-delay:-5.5s" cx="340" cy="0" r="3"/>
        <circle class="snowd" style="animation-delay:-3s" cx="100" cy="0" r="2"/>
