        <ellipse cx="270" cy="78" rx="8" ry="4" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/>
        <path d="M270 34 L270 14" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
