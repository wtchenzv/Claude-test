      <g class="trainx">
        <g>
          <path d="M0 224 Q0 208 14 208 L88 208 Q112 208 122 224 L122 236 L0 236Z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
